version: "3.9"

services:
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: vector_pg
    environment:
      POSTGRES_DB: ${VECTOR_DB_NAME:-exegetos}
      POSTGRES_USER: ${VECTOR_DB_USER:-vector_admin}
      POSTGRES_PASSWORD: ${VECTOR_DB_PASSWORD:-change_me}
    ports:
      - "${VECTOR_DB_PORT:-5434}:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.8.1
    container_name: vector_qdrant
    ports:
      - "${QDRANT_HTTP_PORT:-6335}:6333"
      - "${QDRANT_GRPC_PORT:-6336}:6334"
    volumes:
      - ./qdrant_data:/qdrant/storage
    restart: unless-stopped
