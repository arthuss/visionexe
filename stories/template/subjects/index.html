<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Subjects Viewer</title>
    <style>
      :root {
        --bg: #0f0f0f;
        --panel: #1b1b1b;
        --text: #f2f2f2;
        --muted: #9aa0a6;
        --accent: #70c1ff;
      }
      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      header {
        padding: 16px 20px;
        background: #111;
        border-bottom: 1px solid #2a2a2a;
      }
      header h1 {
        margin: 0 0 8px 0;
        font-size: 18px;
      }
      header .controls {
        display: flex;
        gap: 12px;
        align-items: center;
      }
      input, select {
        background: var(--panel);
        color: var(--text);
        border: 1px solid #333;
        padding: 6px 8px;
        border-radius: 4px;
      }
      main {
        display: grid;
        grid-template-columns: 320px 1fr;
        height: calc(100vh - 70px);
      }
      #list {
        overflow: auto;
        border-right: 1px solid #2a2a2a;
        background: var(--panel);
      }
      #list .item {
        padding: 10px 12px;
        border-bottom: 1px solid #2a2a2a;
        cursor: pointer;
      }
      #list .item:hover {
        background: #242424;
      }
      #list .item .id {
        color: var(--accent);
        font-size: 12px;
      }
      #details {
        padding: 16px 20px;
        overflow: auto;
      }
      .tag {
        display: inline-block;
        padding: 2px 6px;
        margin-right: 6px;
        background: #2a2a2a;
        border-radius: 4px;
        font-size: 12px;
        color: var(--muted);
      }
      .section {
        margin-top: 18px;
      }
      .section h3 {
        margin: 0 0 6px 0;
        font-size: 14px;
        color: var(--accent);
      }
      .muted {
        color: var(--muted);
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
      }
      th, td {
        padding: 6px;
        border-bottom: 1px solid #2a2a2a;
        text-align: left;
      }
      .state-block {
        padding: 8px 0;
        border-bottom: 1px solid #2a2a2a;
      }
      .image-links {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 6px;
      }
      .image-links a {
        color: var(--accent);
        text-decoration: none;
        font-size: 12px;
      }
      .image-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
        gap: 8px;
        margin-top: 10px;
      }
      .image-grid img {
        width: 100%;
        height: auto;
        display: block;
        border-radius: 6px;
        border: 1px solid #2a2a2a;
        background: #111;
      }
      .image-grid a {
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Subjects Viewer</h1>
      <div class="controls">
        <input id="search" type="text" placeholder="Search subjects..." />
        <select id="typeFilter">
          <option value="">All types</option>
        </select>
        <span id="count" class="muted"></span>
      </div>
    </header>
    <main>
      <div id="list"></div>
      <div id="details">
        <div class="muted">Select a subject to view details.</div>
      </div>
    </main>
    <script>
      const registryPath = "registry.json";
      const profilesPath = "profiles.jsonl";
      const occurrencesPath = "occurrences.jsonl";
      const cardsPath = "asset_bible_cards.jsonl";

      const listEl = document.getElementById("list");
      const detailsEl = document.getElementById("details");
      const searchEl = document.getElementById("search");
      const typeFilterEl = document.getElementById("typeFilter");
      const countEl = document.getElementById("count");

      const state = {
        registry: [],
        profiles: new Map(),
        occurrences: [],
        cards: new Map(),
        filtered: []
      };

      const imageCache = new Map();
      const imageExts = [".png", ".jpg", ".jpeg", ".webp", ".gif"];

      function parseJsonl(text) {
        return text
          .split("\n")
          .map(line => line.trim())
          .filter(Boolean)
          .map(line => JSON.parse(line));
      }

      async function loadData() {
        const [registryRes, profilesRes, occurrencesRes, cardsRes] = await Promise.all([
          fetch(registryPath),
          fetch(profilesPath),
          fetch(occurrencesPath),
          fetch(cardsPath)
        ]);
        state.registry = await registryRes.json();
        const profiles = parseJsonl(await profilesRes.text());
        profiles.forEach(profile => state.profiles.set(profile.id, profile));
        state.occurrences = parseJsonl(await occurrencesRes.text());
        const cards = parseJsonl(await cardsRes.text());
        cards.forEach(card => state.cards.set(card.id, card));
        populateTypes();
        applyFilters();
      }

      function populateTypes() {
        const types = Array.from(new Set(state.registry.map(item => item.type))).sort();
        types.forEach(type => {
          const option = document.createElement("option");
          option.value = type;
          option.textContent = type;
          typeFilterEl.appendChild(option);
        });
      }

      function applyFilters() {
        const query = searchEl.value.trim().toLowerCase();
        const type = typeFilterEl.value;
        state.filtered = state.registry.filter(item => {
          const matchesQuery =
            !query ||
            item.id.toLowerCase().includes(query) ||
            (item.name && item.name.toLowerCase().includes(query));
          const matchesType = !type || item.type === type;
          return matchesQuery && matchesType;
        });
        renderList();
      }

      function renderList() {
        listEl.innerHTML = "";
        state.filtered.forEach(item => {
          const div = document.createElement("div");
          div.className = "item";
          div.innerHTML = `
            <div class="id">${item.id}</div>
            <div>${item.name || "(unnamed)"} - ${item.type}</div>
            <div class="muted">occurrences: ${item.occurrence_count}${item.is_dynamic ? " - dynamic" : ""}</div>
          `;
          div.onclick = () => showDetails(item.id);
          listEl.appendChild(div);
        });
        countEl.textContent = `${state.filtered.length} subjects`;
      }

      function showDetails(subjectId) {
        const profile = state.profiles.get(subjectId);
        if (!profile) {
          detailsEl.innerHTML = "<div class=\"muted\">Profile not found.</div>";
          return;
        }
        const occs = state.occurrences.filter(o => o.subject_id === subjectId).slice(0, 50);
        const cardEntry = state.cards.get(subjectId);
        const roles = (profile.roles || []).map(r => `<span class="tag">${r}</span>`).join("");
        const traits = (profile.visual_traits || []).join(", ");
        const changes = (profile.changes || []).join(", ");
        const imageSection = renderImageSection(cardEntry);
        const states = (profile.states || []).map(state => {
          const segmentLabels = (state.segment_labels || []).join(", ");
          const sceneLabels = (state.scene_labels || []).join(", ");
          const notes = (state.notes || []).join(", ");
          return `
            <div class="state-block">
              <strong>${state.label}</strong>
              <div class="muted">chapters: ${state.chapter_start} - ${state.chapter_end}</div>
              ${segmentLabels ? `<div class="muted">segments: ${segmentLabels}</div>` : ""}
              ${sceneLabels ? `<div class="muted">scenes: ${sceneLabels}</div>` : ""}
              ${notes ? `<div class="muted">notes: ${notes}</div>` : ""}
            </div>
          `;
        }).join("");
        detailsEl.innerHTML = `
          <h2>${profile.name || subjectId}</h2>
          <div class="section">
            <span class="tag">${profile.type}</span>
            <span class="tag">occurrences: ${profile.occurrence_count}</span>
            <span class="tag">${profile.is_dynamic ? "dynamic" : "static"}</span>
          </div>
          <div class="section">
            <h3>State Policy</h3>
            <div>${profile.state_policy || "manual"}</div>
          </div>
          <div class="section">
            <h3>Roles</h3>
            ${roles || "<div class=\"muted\">None</div>"}
          </div>
          <div class="section">
            <h3>Visual Traits</h3>
            <div>${traits || "<span class=\"muted\">None</span>"}</div>
          </div>
          <div class="section">
            <h3>Changes</h3>
            <div>${changes || "<span class=\"muted\">None</span>"}</div>
          </div>
          <div class="section">
            <h3>States</h3>
            <div>${states || "<span class=\"muted\">None</span>"}</div>
          </div>
          <div class="section">
            <h3>Occurrences (first 50)</h3>
            ${renderOccurrences(occs)}
          </div>
          ${imageSection}
          ${renderAssetCard(cardEntry)}
        `;

        loadImageLinks(cardEntry);
      }

      function renderOccurrences(items) {
        if (!items.length) {
          return "<div class=\"muted\">No occurrences.</div>";
        }
        const rows = items.map(item => `
          <tr>
            <td>${item.chapter}</td>
            <td>${item.segment_label}</td>
            <td>${item.scene_label || ""}</td>
            <td>${item.source_id}</td>
            <td>${item.source_path || ""}</td>
          </tr>
        `).join("");
        return `
          <table>
            <thead>
              <tr>
                <th>Chapter</th>
                <th>Segment</th>
                <th>Scene</th>
                <th>Source ID</th>
                <th>Source Path</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        `;
      }

      function renderAssetCard(cardEntry) {
        if (!cardEntry || !cardEntry.card) {
          return `<div class="section"><h3>Asset Card</h3><div class="muted">No asset card found.</div></div>`;
        }
        const card = cardEntry.card;
        const tags = (card.tags || []).map(tag => `<span class="tag">${tag}</span>`).join("");
        const anatomy = (card.visual_anatomy || []).map(item => `<div>${item}</div>`).join("");
        const evolution = (card.evolution || []).map(item => `<div>${item}</div>`).join("");
        const props = (card.props || []).map(item => `<div>${item}</div>`).join("");
        const keywords = (card.prompt_keywords || []).join(", ");
        const prompt = card.prompt_block || "";
        const phasePrompts = (card.phase_prompts || []).map(phase => {
          if (!phase || typeof phase !== "object") {
            return "";
          }
          const label = phase.label || phase.state_id || "Phase";
          const summary = phase.summary ? `<div class="muted">${phase.summary}</div>` : "";
          const phaseKeywords = (phase.prompt_keywords || []).join(", ");
          const phasePrompt = phase.prompt_block ? `<div class="muted">${phase.prompt_block}</div>` : "";
          const keywordBlock = phaseKeywords ? `<div class="muted">Keywords: ${phaseKeywords}</div>` : "";
          return `
            <div class="state-block">
              <strong>${label}</strong>
              ${summary}
              ${keywordBlock}
              ${phasePrompt}
            </div>
          `;
        }).join("");
        const subjectDir = cardEntry.subject_dir ? `<div class="muted">Folder: ${cardEntry.subject_dir}</div>` : "";
        return `
          <div class="section">
            <h3>Asset Card</h3>
            ${subjectDir}
            <div><strong>Description:</strong> ${card.description || ""}</div>
            ${tags ? `<div>${tags}</div>` : ""}
            <div class="section">
              <h3>Visual Anatomy</h3>
              ${anatomy || `<div class="muted">None</div>`}
            </div>
            <div class="section">
              <h3>Evolution / Variants</h3>
              ${evolution || `<div class="muted">None</div>`}
            </div>
            <div class="section">
              <h3>Props & Equipment</h3>
              ${props || `<div class="muted">None</div>`}
            </div>
            <div class="section">
              <h3>Prompt Keywords</h3>
              <div>${keywords || `<span class="muted">None</span>`}</div>
            </div>
            <div class="section">
              <h3>Prompt Block</h3>
              <div class="muted">${prompt || "None"}</div>
            </div>
            <div class="section">
              <h3>Phase Prompts</h3>
              ${phasePrompts || `<div class="muted">None</div>`}
            </div>
          </div>
        `;
      }

      function normalizePath(value) {
        return value ? value.replace(/\\/g, "/") : "";
      }

      function renderImageSection(cardEntry) {
        if (!cardEntry || !cardEntry.subject_dir) {
          return `<div class="section"><h3>Images</h3><div class="muted">No subject folder found.</div></div>`;
        }
        const subjectDir = normalizePath(cardEntry.subject_dir);
        const imagesDir = `${subjectDir}/images/asset_bible`;
        return `
          <div class="section">
            <h3>Images</h3>
            <div class="image-links">
              <a href="${subjectDir}/" target="_blank" rel="noopener">Open subject folder</a>
              <a href="${imagesDir}/" target="_blank" rel="noopener">Open asset_bible images</a>
            </div>
            <div id="image-links" data-folder="${imagesDir}" class="muted">Loading images...</div>
          </div>
        `;
      }

      function loadImageLinks(cardEntry) {
        if (!cardEntry || !cardEntry.subject_dir) {
          return;
        }
        const folderPath = `${normalizePath(cardEntry.subject_dir)}/images/asset_bible/`;
        const container = document.getElementById("image-links");
        if (!container) {
          return;
        }
        const expected = container.dataset.folder || "";
        if (expected && expected !== folderPath.replace(/\/$/, "")) {
          return;
        }
        const folderUrl = new URL(folderPath, window.location.href);
        const cacheKey = folderUrl.pathname;
        if (imageCache.has(cacheKey)) {
          renderImageGrid(container, folderUrl, imageCache.get(cacheKey));
          return;
        }
        fetch(folderUrl.href)
          .then(res => {
            if (!res.ok) {
              throw new Error(`HTTP ${res.status}`);
            }
            return res.text();
          })
          .then(text => {
            const links = parseDirectoryListing(text);
            imageCache.set(cacheKey, links);
            renderImageGrid(container, folderUrl, links);
          })
          .catch(err => {
            container.textContent = `No images found (failed to load ${folderUrl.pathname}).`;
          });
      }

      function parseDirectoryListing(html) {
        const links = [];
        const hrefRe = /href="([^"]+)"/g;
        let match;
        while ((match = hrefRe.exec(html)) !== null) {
          const href = match[1];
          if (!href || href.endsWith("/")) {
            continue;
          }
          const lower = href.toLowerCase();
          if (!imageExts.some(ext => lower.endsWith(ext))) {
            continue;
          }
          links.push(href);
        }
        return links;
      }

      function renderImageGrid(container, folderUrl, links) {
        if (!links.length) {
          container.textContent = "No images found.";
          return;
        }
        const maxItems = 24;
        const items = links.slice(0, maxItems);
        const grid = items.map(name => {
          const url = new URL(name, folderUrl).href;
          return `
            <a href="${url}" target="_blank" rel="noopener">
              <img src="${url}" loading="lazy" alt="${name}" />
            </a>
          `;
        }).join("");
        const more = links.length > maxItems
          ? `<div class="muted">Showing ${maxItems} of ${links.length}. Open folder for more.</div>`
          : "";
        container.innerHTML = `<div class="image-grid">${grid}</div>${more}`;
      }

      searchEl.addEventListener("input", applyFilters);
      typeFilterEl.addEventListener("change", applyFilters);

      loadData().catch(err => {
        detailsEl.innerHTML = `<div class=\"muted\">Failed to load data: ${err}</div>`;
      });
    </script>
  </body>
</html>
